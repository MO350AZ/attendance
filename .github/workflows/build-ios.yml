
name: Build iOS IPA and Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dar-alhafez-ios-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bump version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("version.json")
          if not path.exists():
              raise SystemExit("ERROR: version.json not found")

          data = json.loads(path.read_text(encoding="utf-8"))

          if isinstance(data, dict):
              keys = ("version", "appVersion", "app_version")
              key = next((k for k in keys if k in data), None)
              if key is None:
                  raise SystemExit(
                      "ERROR: No version, appVersion, or app_version "
                      "field found in version.json"
                  )
              current = str(data[key])
          elif isinstance(data, str):
              key = None
              current = data
          else:
              raise SystemExit("ERROR: Unsupported version.json format")

          match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", current.strip())
          if not match:
              raise SystemExit(
                  f"ERROR: Unsupported version format: {current}"
              )

          major, minor, patch = map(int, match.groups())
          new_version = f"{major}.{minor}.{patch + 1}"

          if key is None:
              data = new_version
          else:
              data[key] = new_version

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={new_version}\n")
              f.write(f"tag=v{new_version}\n")

          print(f"Version: {current} -> {new_version}")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Prepare web app
        run: |
          mkdir -p www

          curl -fsSL \
            https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.legacy.min.js \
            -o www/qr-scanner.legacy.min.js

          curl -fsSL \
            https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js \
            -o www/qrcode.min.js

          python3 tools/prepare_native.py

      - name: Add iOS if missing
        run: |
          if [ ! -f ios/App/Podfile ]; then
            npx cap add ios
          fi

      - name: Generate icons
        run: npx capacitor-assets generate --ios

      - name: Add camera permission
        run: |
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string يستخدم التطبيق الكاميرا لمسح QR للطلاب." \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription يستخدم التطبيق الكاميرا لمسح QR للطلاب." \
            "$PLIST"

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      - name: Verify iOS workspace
        run: |
          test -f ios/App/App.xcworkspace/contents.xcworkspacedata
          xcodebuild -list -workspace ios/App/App.xcworkspace

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          rm -rf Payload Attendance.ipa

          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"

          mkdir Payload
          cp -R "$APP_PATH" Payload/App.app

          zip -qry Attendance.ipa Payload
          ls -lh Attendance.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dar-alhafez-ios-ipa-v${{ steps.version.outputs.version }}
          path: Attendance.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Commit updated version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: release v${VERSION}"
            git push origin "HEAD:${BRANCH}"
          else
            echo "No version changes to commit."
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" Attendance.ipa \
            --title "Dar Al-Hafez $TAG" \
            --generate-notes
