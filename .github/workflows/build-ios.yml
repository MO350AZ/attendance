name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: |
          mkdir -p www

          curl -fsSL \
            https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.legacy.min.js \
            -o www/qr-scanner.legacy.min.js

          curl -fsSL \
            https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js \
            -o www/qrcode.min.js

          python3 tools/prepare_native.py

      - name: Add iOS
        run: npx cap add ios

      - name: Add camera permission
        run: |
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string يستخدم التطبيق الكاميرا لمسح QR للطلاب." \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription يستخدم التطبيق الكاميرا لمسح QR للطلاب." \
            "$PLIST"

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          rm -rf Payload Attendance.ipa

          mkdir Payload

          cp -R \
            build/Build/Products/Release-iphoneos/App.app \
            Payload/App.app

          zip -qry Attendance.ipa Payload

          ls -lh Attendance.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dar-alhafez-ios-ipa
          path: Attendance.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dar-alhafez-ios-${{ github.run_number }}"

          gh release create "$TAG" \
            Attendance.ipa \
            --title "دار الحافظ iOS ${{ github.run_number }}" \
            --notes "Unsigned IPA build for Dar Alhafez."
