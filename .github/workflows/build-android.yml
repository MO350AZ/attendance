name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Prepare packaged web app
        run: |
          mkdir -p www
          curl -fsSL https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.legacy.min.js -o www/qr-scanner.legacy.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js -o www/qrcode.min.js
          python3 tools/prepare_native.py

      - name: Add Android platform
        run: npx cap add android

      - name: Add camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.CAMERA" not in s:
              s = s.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.CAMERA" />\n    <application',
                  1
              )

          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Dar-Alhafez.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dar-alhafez-android-apk
          path: Dar-Alhafez.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dar-alhafez-android-${{ github.run_number }}"

          gh release create "$TAG" \
            Dar-Alhafez.apk \
            --title "دار الحافظ Android ${{ github.run_number }}" \
            --notes "دار الحافظ Android APK - Build ${{ github.run_number }}"
